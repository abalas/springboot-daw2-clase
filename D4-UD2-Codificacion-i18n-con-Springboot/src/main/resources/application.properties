spring.application.name=D4-UD2-Codificacion-i18n-con-Springboot
# Charset con el que Spring lee el cuerpo de las peticiones (UTF-8 ya es el valor por defecto).
# Spring Boot 4 usa spring.servlet.encoding.*  (en Spring Boot 3 era server.servlet.encoding.*)
spring.servlet.encoding.charset=UTF-8

